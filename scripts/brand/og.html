<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;600&display=block"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #1c1f1e;
        color: #f1eee7;
        font-family: Archivo, Arial, sans-serif;
      }
      .road {
        position: absolute;
        top: 0;
        right: 150px;
        width: 250px;
        height: 100%;
        background: #232725;
      }
      .road::after {
        content: '';
        position: absolute;
        left: 50%;
        top: -20px;
        width: 12px;
        height: 700px;
        margin-left: -6px;
        background: repeating-linear-gradient(#ffc21a 0 56px, transparent 56px 96px);
      }
      .pin {
        position: absolute;
        right: 172px;
        top: 150px;
        filter: drop-shadow(0 14px 0 #000);
      }
      .content {
        position: absolute;
        left: 80px;
        top: 70px;
        width: 680px;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 40px;
        font-weight: 900;
        font-stretch: 112%;
      }
      .wordmark b {
        color: #ffc21a;
      }
      h1 {
        margin-top: 56px;
        font-size: 150px;
        line-height: 0.86;
        font-weight: 900;
        font-stretch: 125%;
        letter-spacing: -0.035em;
      }
      h1 span {
        color: #ffc21a;
      }
      p {
        margin-top: 34px;
        font-size: 30px;
        line-height: 1.3;
        color: #e4dfd4;
      }
      .tag {
        position: absolute;
        left: 80px;
        bottom: 44px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 21px;
        color: #a8a296;
      }
    </style>
  </head>
  <body>
    <div class="road"></div>
    <svg class="pin" width="206" height="258" viewBox="0 0 32 40" aria-hidden="true">
      <path
        d="M16 1C8 1 2 7 2 14.5C2 24 16 38 16 38C16 38 30 24 30 14.5C30 7 24 1 16 1Z"
        fill="#FFC21A"
      />
      <path
        d="M15.5 1.5L18 6.5L14.5 10L17.5 13.5L15.5 16"
        fill="none"
        stroke="#1C1F1E"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <div class="content">
      <div class="wordmark">
        <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="15" fill="#2A2E2C" />
          <path
            d="M32 8C22 8 14 16 14 26C14 38 32 50 32 50C32 50 50 38 50 26C50 16 42 8 32 8Z"
            fill="#FFC21A"
          />
          <path
            d="M31 8L35.5 16L29.5 21.5L35 27.5L31.5 32"
            fill="none"
            stroke="#2A2E2C"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <rect x="12" y="54.5" width="10" height="3" rx="1.5" fill="#FFC21A" />
          <rect x="27" y="54.5" width="10" height="3" rx="1.5" fill="#FFC21A" />
          <rect x="42" y="54.5" width="10" height="3" rx="1.5" fill="#FFC21A" />
        </svg>
        <span>infra<b>map</b></span>
      </div>
      <h1>Viu?<br /><span>Marca.</span></h1>
      <p>Buraco, bueiro, calçada, poste apagado.<br />Marque no mapa de Resende e acompanhe.</p>
    </div>
    <div class="tag">Resende · RJ · projeto de extensão AEDB</div>
  </body>
</html>
